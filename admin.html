<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #09090d;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login {
            width: 90%;
            max-width: 400px;
            background: #15151c;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0,0,0,.5);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        p {
            color: #999;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: #0d0d12;
            border: 1px solid #333;
            border-radius: 10px;
            color: white;
            outline: none;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #5865f2;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4752c4;
        }

        #error {
            color: #ff5c5c;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>

<body>

<div class="login">

    <h1>Admin Panel</h1>
    <p>Sign in to manage your VPN pages.</p>

    <input
        id="password"
        type="password"
        placeholder="Admin password"
    >

    <button onclick="login()">
        Login
    </button>

    <div id="error">
        Incorrect password.
    </div>

</div>

<script>

function login() {

    const password = document.getElementById("password").value;

    /*
        TEMPORARY ONLY.

        We will replace this with real server-side
        authentication later.
    */

    if (password === "CHANGE_THIS_LATER") {
        window.location.href = "dashboard.html";
    } else {
        document.getElementById("error").style.display = "block";
    }
}

</script>

</body>
</html>
