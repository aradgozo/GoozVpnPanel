<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #09090d;
            color: white;
        }

        header {
            padding: 22px;
            background: #111118;
            border-bottom: 1px solid #25252d;
        }

        header h1 {
            margin: 0;
        }

        header p {
            color: #888;
            margin-bottom: 0;
        }

        .container {
            width: 92%;
            max-width: 900px;
            margin: 30px auto;
        }

        .card {
            background: #15151c;
            border: 1px solid #25252d;
            border-radius: 16px;
            padding: 25px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            color: #aaa;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #333;
            border-radius: 10px;
            background: #0d0d12;
            color: white;
            outline: none;
        }

        textarea {
            min-height: 160px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 22px;
            border: none;
            border-radius: 10px;
            background: #5865f2;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4752c4;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #result {
            display: none;
            margin-top: 20px;
            padding: 18px;
            background: #102c1b;
            border-radius: 10px;
            color: #70f09a;
        }

        #error {
            display: none;
            margin-top: 20px;
            padding: 18px;
            background: #351414;
            border-radius: 10px;
            color: #ff7777;
        }

        .url {
            margin-top: 10px;
            padding: 12px;
            background: #09090d;
            border-radius: 8px;
            word-break: break-all;
            color: white;
        }
    </style>
</head>

<body>

<header>
    <h1>VPN Dashboard</h1>
    <p>Create private VPN pages.</p>
</header>

<div class="container">

    <div class="card">

        <h2>Create VPN</h2>

        <label>VPN Name</label>
        <input
            id="name"
            type="text"
            placeholder="Germany #1"
        >

        <label>VPN Config</label>
        <textarea
            id="config"
            placeholder="Paste your VLESS or VMess config here..."
        ></textarea>

        <label>VPN Status Page URL</label>
        <input
            id="sourceUrl"
            type="url"
            placeholder="https://your-vpn-panel.example/..."
        >

        <label>Traffic Limit</label>
        <input
            id="limit"
            type="number"
            placeholder="100"
        >

        <label>Expiration Date</label>
        <input
            id="expiration"
            type="date"
        >

        <button id="generateButton" onclick="generateVPN()">
            Generate Private Page
        </button>

        <div id="result"></div>

        <div id="error"></div>

    </div>

</div>

<script>

async function generateVPN() {

    const button =
        document.getElementById("generateButton");

    const name =
        document.getElementById("name").value.trim();

    const config =
        document.getElementById("config").value.trim();

    const sourceUrl =
        document.getElementById("sourceUrl").value.trim();

    const trafficLimit =
        document.getElementById("limit").value;

    const expiration =
        document.getElementById("expiration").value;

    const result =
        document.getElementById("result");

    const error =
        document.getElementById("error");

    result.style.display = "none";
    error.style.display = "none";

    if (!name || !config || !sourceUrl) {

        error.textContent =
            "Please fill in the VPN name, config, and status page URL.";

        error.style.display = "block";

        return;
    }

    button.disabled = true;
    button.textContent = "Creating...";

    try {

        const response = await fetch("/api/create-vpn", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                name: name,
                config: config,
                sourceUrl: sourceUrl,
                trafficLimit: trafficLimit,
                expiration: expiration
            })

        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.error || "Failed to create VPN."
            );
        }

        const publicUrl =
            `${window.location.origin}/vpn.html?id=${data.id}`;

        result.innerHTML = `
            <strong>VPN created successfully!</strong>

            <br><br>

            Your private page:

            <div class="url">
                ${publicUrl}
            </div>

            <br>

            Save this URL and give it to your friend.
        `;

        result.style.display = "block";

        document.getElementById("name").value = "";
        document.getElementById("config").value = "";
        document.getElementById("sourceUrl").value = "";
        document.getElementById("limit").value = "";
        document.getElementById("expiration").value = "";

    } catch (err) {

        error.textContent =
            err.message;

        error.style.display = "block";

    } finally {

        button.disabled = false;
        button.textContent = "Generate Private Page";

    }

}

</script>

</body>
</html>
