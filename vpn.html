<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VPN</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #09090d;
            color: white;
            display: flex;
            justify-content: center;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        .card {
            background: #15151c;
            border: 1px solid #25252d;
            border-radius: 18px;
            padding: 25px;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        .status {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 20px;
            background: #12351f;
            color: #6ff09a;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .info {
            background: #0d0d12;
            border-radius: 12px;
            padding: 16px;
            margin-top: 12px;
        }

        .label {
            color: #888;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .value {
            font-size: 17px;
        }

        .config {
            margin-top: 20px;
            padding: 15px;
            background: #0d0d12;
            border-radius: 12px;
            word-break: break-all;
            white-space: pre-wrap;
            max-height: 180px;
            overflow: auto;
            color: #ccc;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #5865f2;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4752c4;
        }

        .error {
            text-align: center;
            color: #ff7070;
        }

        .loading {
            text-align: center;
            color: #aaa;
        }

        #content {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div id="loading" class="loading">
            Loading VPN...
        </div>

        <div id="error" class="error"></div>

        <div id="content">

            <h1 id="name"></h1>

            <div class="status" id="status">
                ● Active
            </div>

            <div class="info">
                <div class="label">Used Traffic</div>
                <div class="value" id="usedTraffic">
                    Loading...
                </div>
            </div>

            <div class="info">
                <div class="label">Traffic Limit</div>
                <div class="value" id="trafficLimit">
                    Loading...
                </div>
            </div>

            <div class="info">
                <div class="label">Remaining Traffic</div>
                <div class="value" id="remainingTraffic">
                    Loading...
                </div>
            </div>

            <div class="info">
                <div class="label">Expiration</div>
                <div class="value" id="expiration">
                    Loading...
                </div>
            </div>

            <div class="config" id="config"></div>

            <button onclick="copyConfig()">
                Copy VPN Config
            </button>

        </div>

    </div>

</div>

<script>

let vpnConfig = "";

async function loadVPN() {

    const params =
        new URLSearchParams(window.location.search);

    const id = params.get("id");

    if (!id) {
        showError("Invalid VPN page.");
        return;
    }

    try {

        const response = await fetch(
            `/api/get-vpn?id=${encodeURIComponent(id)}`
        );

        const data = await response.json();

        if (!response.ok || !data.success) {

            throw new Error(
                data.error || "VPN not found."
            );

        }

        const vpn = data.vpn;

        vpnConfig = vpn.config;

        /*
         * VPN NAME
         */

        document.getElementById("name")
            .textContent = vpn.name || "VPN";


        /*
         * TRAFFIC
         */

        if (vpn.traffic) {

            document.getElementById("usedTraffic")
                .textContent =
                vpn.traffic.used || "Unknown";

            document.getElementById("trafficLimit")
                .textContent =
                vpn.traffic.limit || "Unknown";

            document.getElementById("remainingTraffic")
                .textContent =
                vpn.traffic.remaining || "Unknown";

        } else {

            document.getElementById("usedTraffic")
                .textContent = "Unknown";

            document.getElementById("trafficLimit")
                .textContent = "Unknown";

            document.getElementById("remainingTraffic")
                .textContent = "Unknown";
        }


        /*
         * EXPIRATION
         */

        document.getElementById("expiration")
            .textContent =
            vpn.expiration || "No expiration";


        /*
         * CONFIG
         */

        document.getElementById("config")
            .textContent =
            vpn.config || "No configuration available.";


        /*
         * SHOW PAGE
         */

        document.getElementById("loading")
            .style.display = "none";

        document.getElementById("content")
            .style.display = "block";


    } catch (error) {

        showError(error.message);

    }

}


function showError(message) {

    document.getElementById("loading")
        .style.display = "none";

    document.getElementById("error")
        .textContent = message;

    document.getElementById("error")
        .style.display = "block";

}


async function copyConfig() {

    try {

        await navigator.clipboard.writeText(
            vpnConfig
        );

        alert("VPN config copied!");

    } catch (error) {

        alert("Could not copy VPN config.");

    }

}


/*
 * LOAD THE VPN
 */

loadVPN();


/*
 * REFRESH TRAFFIC EVERY 30 SECONDS
 */

setInterval(() => {

    loadVPN();

}, 30000);

</script>

</body>
</html>
