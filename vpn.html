<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VPN Information</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0b0b0f;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 650px;
            background: #15151c;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .status {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 20px;
            background: #163b25;
            color: #55e889;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .info {
            background: #0d0d12;
            border-radius: 12px;
            padding: 18px;
            margin-top: 12px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 10px 0;
            border-bottom: 1px solid #25252d;
        }

        .row:last-child {
            border-bottom: none;
        }

        .label {
            color: #999;
        }

        .value {
            text-align: right;
            word-break: break-word;
        }

        .progress-container {
            margin-top: 25px;
        }

        .progress-background {
            width: 100%;
            height: 12px;
            background: #292933;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 37%;
            background: #5865f2;
            border-radius: 20px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #5865f2;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4752c4;
        }

        #error {
            display: none;
            color: #ff6b6b;
        }
    </style>
</head>

<body>

<div class="card">

    <div id="error">
        VPN page not found.
    </div>

    <div id="content">

        <h1 id="vpnName">Loading...</h1>

        <div class="status">
            🟢 Active
        </div>

        <div class="info">

            <div class="row">
                <span class="label">Used</span>
                <span class="value" id="used">37.4 GB</span>
            </div>

            <div class="row">
                <span class="label">Remaining</span>
                <span class="value" id="remaining">62.6 GB</span>
            </div>

            <div class="row">
                <span class="label">Traffic Limit</span>
                <span class="value" id="limit">100 GB</span>
            </div>

            <div class="row">
                <span class="label">Expires</span>
                <span class="value" id="expiration">September 15, 2026</span>
            </div>

            <div class="row">
                <span class="label">Protocol</span>
                <span class="value" id="protocol">VLESS / VMess</span>
            </div>

        </div>

        <div class="progress-container">

            <p>Traffic Usage</p>

            <div class="progress-background">
                <div class="progress" id="progress"></div>
            </div>

        </div>

        <div class="buttons">

            <button onclick="copyConfig()">
                Copy Config
            </button>

        </div>

    </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

console.log("VPN UUID:", id);

function copyConfig() {

    const config = "YOUR_VPN_CONFIG_WILL_GO_HERE";

    navigator.clipboard.writeText(config);

    alert("VPN config copied!");
}

</script>

</body>
</html>
